[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-sigxtalk"
version = "0.1.0"
description = "Python rewrite of SigXTalk: Dissecting crosstalk induced by cell-cell communication"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "dhg>=0.9.4",
    "liana",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "anndata>=0.10",
    "scanpy>=1.9",
    "networkx>=3.0",
]

[project.optional-dependencies]
benchmark = ["rpy2>=3.5", "lightgbm>=4.0"]
dev = ["pytest>=7.0", "pytest-cov", "rpy2>=3.5", "lightgbm>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]
